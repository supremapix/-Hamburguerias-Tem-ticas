<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgSponge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E243A"/>
      <stop offset="50%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#1B262C"/>
    </linearGradient>
    <linearGradient id="spongeYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF500"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="spongePore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="eyeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="tieRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="pantsBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="100%" stop-color="#583101"/>
    </linearGradient>
    <filter id="charShadowSponge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgSponge)"/>

  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Glowing Underwater Bubbles / Spotlights -->
  <circle cx="300" cy="250" r="210" fill="#FACC15" opacity="0.15"/>
  <circle cx="160" cy="120" r="14" fill="#38BDF8" opacity="0.3"/>
  <circle cx="430" cy="90" r="20" fill="#38BDF8" opacity="0.25"/>
  <circle cx="460" cy="200" r="10" fill="#38BDF8" opacity="0.4"/>
  <circle cx="140" cy="380" r="16" fill="#38BDF8" opacity="0.2"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#charShadowSponge)">
    <!-- Sponge Body (Wavy Sponge Edges) -->
    <rect x="165" y="100" width="270" height="280" rx="28" fill="url(#spongeYellow)" stroke="#1A1A1A" stroke-width="8"/>

    <!-- Pores / Dimples -->
    <ellipse cx="205" cy="135" rx="14" ry="10" fill="url(#spongePore)" opacity="0.65"/>
    <ellipse cx="395" cy="140" rx="16" ry="12" fill="url(#spongePore)" opacity="0.65"/>
    <ellipse cx="190" cy="285" rx="18" ry="14" fill="url(#spongePore)" opacity="0.65"/>
    <ellipse cx="405" cy="290" rx="14" ry="10" fill="url(#spongePore)" opacity="0.65"/>
    <ellipse cx="230" cy="355" rx="12" ry="8" fill="url(#spongePore)" opacity="0.65"/>
    <ellipse cx="370" cy="360" rx="10" ry="7" fill="url(#spongePore)" opacity="0.65"/>

    <!-- Big Round White Eyes -->
    <circle cx="255" cy="205" r="46" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="7"/>
    <circle cx="345" cy="205" r="46" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="7"/>

    <!-- Eye Blue Iris & Pupil -->
    <circle cx="264" cy="205" r="22" fill="url(#eyeBlue)"/>
    <circle cx="264" cy="205" r="12" fill="#1A1A1A"/>
    <circle cx="269" cy="200" r="4" fill="#FFFFFF"/>

    <circle cx="336" cy="205" r="22" fill="url(#eyeBlue)"/>
    <circle cx="336" cy="205" r="12" fill="#1A1A1A"/>
    <circle cx="341" cy="200" r="4" fill="#FFFFFF"/>

    <!-- Three Eyelashes on each eye -->
    <path d="M235 155 L228 135 M255 152 L255 130 M275 155 L282 135" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
    <path d="M325 155 L318 135 M345 152 L345 130 M365 155 L372 135" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>

    <!-- Cute Curved Nose -->
    <path d="M292 205 C288 185, 312 185, 308 205 C310 220, 290 220, 292 205 Z" fill="#FACC15" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Rosy Dimpled Cheeks -->
    <ellipse cx="215" cy="245" rx="18" ry="12" fill="#F87171" stroke="#1A1A1A" stroke-width="4"/>
    <ellipse cx="385" cy="245" rx="18" ry="12" fill="#F87171" stroke="#1A1A1A" stroke-width="4"/>
    <!-- Freckles on Cheeks -->
    <circle cx="210" cy="243" r="2" fill="#7F1D1D"/>
    <circle cx="218" cy="240" r="2" fill="#7F1D1D"/>
    <circle cx="215" cy="248" r="2" fill="#7F1D1D"/>
    <circle cx="380" cy="243" r="2" fill="#7F1D1D"/>
    <circle cx="388" cy="240" r="2" fill="#7F1D1D"/>
    <circle cx="385" cy="248" r="2" fill="#7F1D1D"/>

    <!-- Huge Smiling Mouth -->
    <path d="M215 250 Q300 340, 385 250" fill="#991B1B" stroke="#1A1A1A" stroke-width="7"/>
    <!-- Pink Tongue -->
    <path d="M260 295 Q300 275, 340 295 Q300 335, 260 295 Z" fill="#F472B6" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Two Iconic Buck Teeth -->
    <rect x="276" y="260" width="20" height="22" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
    <rect x="304" y="260" width="20" height="22" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>

    <!-- White Shirt Collar & Shirt -->
    <rect x="175" y="375" width="250" height="40" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="7"/>
    <!-- Shirt Collar Peaks -->
    <polygon points="260,375 290,400 270,375" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
    <polygon points="340,375 310,400 330,375" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>

    <!-- Red Tie -->
    <polygon points="295,385 305,385 310,405 300,410 290,405" fill="url(#tieRed)" stroke="#1A1A1A" stroke-width="4"/>
    <polygon points="290,405 310,405 320,455 300,470 280,455" fill="url(#tieRed)" stroke="#1A1A1A" stroke-width="5"/>

    <!-- Brown Pants with Belt -->
    <rect x="175" y="415" width="250" height="55" rx="8" fill="url(#pantsBrown)" stroke="#1A1A1A" stroke-width="7"/>
    <!-- Black Belt Dashes -->
    <rect x="200" y="423" width="25" height="10" rx="3" fill="#1A1A1A"/>
    <rect x="245" y="423" width="25" height="10" rx="3" fill="#1A1A1A"/>
    <rect x="330" y="423" width="25" height="10" rx="3" fill="#1A1A1A"/>
    <rect x="375" y="423" width="25" height="10" rx="3" fill="#1A1A1A"/>
  </g>

  <!-- Cinema Title Banner: BOB ESPONJA -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#FFB800" stroke="#1A1A1A" stroke-width="8"/>
    <rect x="6" y="6" width="488" height="48" rx="24" fill="#0F4C81"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="25" font-weight="900" text-anchor="middle" fill="#FFF500" letter-spacing="2">
      🧽 PERSONAGEM BOB ESPONJA
    </text>
  </g>
</svg>
