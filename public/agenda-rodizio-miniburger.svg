<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgMiniBurger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#2D1A10"/>
    </linearGradient>
    <!-- Classic Golden Bun -->
    <linearGradient id="goldBun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5B041"/>
      <stop offset="100%" stop-color="#BA4A00"/>
    </linearGradient>
    <!-- Cinema Red Bun -->
    <linearGradient id="redBun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#78281F"/>
    </linearGradient>
    <!-- Cinema Black Bun -->
    <linearGradient id="blackBun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <filter id="shadowMiniBurger" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgMiniBurger)"/>
  
  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.3">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Stage Light Glow -->
  <circle cx="300" cy="260" r="230" fill="#FFB800" opacity="0.16"/>

  <!-- Platter Plate Table -->
  <ellipse cx="300" cy="420" rx="240" ry="60" fill="#1A1A1A" stroke="#FFB800" stroke-width="4"/>
  <ellipse cx="300" cy="415" rx="220" ry="50" fill="#2E2E2E"/>

  <!-- Mini Burgers Trio Group with Shadow -->
  <g filter="url(#shadowMiniBurger)">
    
    <!-- 1. LEFT MINI BURGER (Red Cinema Bun) -->
    <g transform="translate(130, 240)">
      <!-- Bottom Bun -->
      <path d="M-50 120 C-50 145, 50 145, 50 120 Z" fill="url(#redBun)" stroke="#1A1A1A" stroke-width="5"/>
      <!-- Meat Patty -->
      <rect x="-55" y="95" width="110" height="24" rx="8" fill="#3E2723" stroke="#1A1A1A" stroke-width="5"/>
      <!-- Melted Cheddar -->
      <path d="M-50 95 L50 95 L40 110 L25 100 L10 115 L-15 100 L-35 112 Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Lettuce -->
      <path d="M-55 85 Q-30 100, 0 85 Q30 100, 55 85" stroke="#4CAF50" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- Top Red Bun -->
      <path d="M-50 85 C-50 25, 50 25, 50 85 Z" fill="url(#redBun)" stroke="#1A1A1A" stroke-width="5"/>
      <!-- White Sesame Seeds -->
      <circle cx="-20" cy="55" r="2.5" fill="#FFFFFF"/>
      <circle cx="0" cy="45" r="2.5" fill="#FFFFFF"/>
      <circle cx="20" cy="55" r="2.5" fill="#FFFFFF"/>
      <!-- Cinema Pick / Toothpick Flag -->
      <line x1="0" y1="25" x2="0" y2="-15" stroke="#DEB887" stroke-width="4"/>
      <polygon points="0,-15 35,-5 0,5" fill="#FFB800" stroke="#1A1A1A" stroke-width="2"/>
    </g>

    <!-- 2. RIGHT MINI BURGER (Black Cinema Bun) -->
    <g transform="translate(470, 240)">
      <!-- Bottom Bun -->
      <path d="M-50 120 C-50 145, 50 145, 50 120 Z" fill="url(#blackBun)" stroke="#1A1A1A" stroke-width="5"/>
      <!-- Meat Patty -->
      <rect x="-55" y="95" width="110" height="24" rx="8" fill="#3E2723" stroke="#1A1A1A" stroke-width="5"/>
      <!-- Melted Cheddar -->
      <path d="M-50 95 L50 95 L35 112 L15 100 L-5 115 L-25 100 L-45 110 Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Lettuce -->
      <path d="M-55 85 Q-30 100, 0 85 Q30 100, 55 85" stroke="#4CAF50" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- Top Black Bun -->
      <path d="M-50 85 C-50 25, 50 25, 50 85 Z" fill="url(#blackBun)" stroke="#1A1A1A" stroke-width="5"/>
      <!-- Golden Sesame Seeds -->
      <circle cx="-20" cy="55" r="2.5" fill="#FFD54F"/>
      <circle cx="0" cy="45" r="2.5" fill="#FFD54F"/>
      <circle cx="20" cy="55" r="2.5" fill="#FFD54F"/>
      <!-- Cinema Pick / Toothpick Flag -->
      <line x1="0" y1="25" x2="0" y2="-15" stroke="#DEB887" stroke-width="4"/>
      <polygon points="0,-15 35,-5 0,5" fill="#E53935" stroke="#1A1A1A" stroke-width="2"/>
    </g>

    <!-- 3. CENTER MINI BURGER (Classic Golden Brioche, slightly larger) -->
    <g transform="translate(300, 210)">
      <!-- Bottom Bun -->
      <path d="M-65 145 C-65 175, 65 175, 65 145 Z" fill="url(#goldBun)" stroke="#1A1A1A" stroke-width="6"/>
      <!-- Double Meat Patty -->
      <rect x="-70" y="115" width="140" height="28" rx="10" fill="#3E2723" stroke="#1A1A1A" stroke-width="6"/>
      <!-- Molten Cheese Cascade -->
      <path d="M-65 115 L65 115 L50 135 L30 120 L10 142 L-15 122 L-40 138 L-60 125 Z" fill="#FFB300" stroke="#1A1A1A" stroke-width="4"/>
      <!-- Bacon Crisps -->
      <path d="M-60 112 Q-20 100, 20 112 Q45 102, 65 110" stroke="#B71C1C" stroke-width="7" fill="none"/>
      <!-- Fresh Curly Lettuce -->
      <path d="M-72 100 Q-45 118, -15 98 Q15 118, 45 98 Q72 115, 75 100" stroke="#4CAF50" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- Tomato Slice -->
      <ellipse cx="0" cy="92" rx="60" ry="12" fill="#E53935" stroke="#1A1A1A" stroke-width="4"/>
      <!-- Top Golden Brioche Bun -->
      <path d="M-65 90 C-65 15, 65 15, 65 90 Z" fill="url(#goldBun)" stroke="#1A1A1A" stroke-width="6"/>
      <!-- Abundant Sesame Seeds -->
      <g fill="#FFF9C4">
        <circle cx="-30" cy="55" r="3"/>
        <circle cx="-15" cy="40" r="3"/>
        <circle cx="0" cy="30" r="3.5"/>
        <circle cx="15" cy="40" r="3"/>
        <circle cx="30" cy="55" r="3"/>
        <circle cx="-10" cy="65" r="3"/>
        <circle cx="10" cy="65" r="3"/>
      </g>
      <!-- Big Cinema Star Pick -->
      <line x1="0" y1="15" x2="0" y2="-30" stroke="#DEB887" stroke-width="5"/>
      <polygon points="0,-48 6,-34 20,-34 9,-25 13,-12 0,-20 -13,-12 -9,-25 -20,-34 -6,-34" fill="#FFB800" stroke="#1A1A1A" stroke-width="3"/>
    </g>

  </g>

  <!-- Cinema Title Banner: RODÍZIO DE MINI BURGERS -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#FFB800" stroke="#1A1A1A" stroke-width="8"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#1A1A1A" letter-spacing="2">
      🍔 RODÍZIO DE MINI BURGERS
    </text>
  </g>
</svg>
