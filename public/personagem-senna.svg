<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgSenna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="helmetYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="40%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="visorTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="50%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="redSuit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="sennaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgSenna)"/>
  
  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FDD835" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Golden Aura / Racing Glory -->
  <circle cx="300" cy="270" r="230" fill="#FDD835" opacity="0.18"/>
  <circle cx="300" cy="270" r="160" fill="#00E676" opacity="0.12"/>

  <!-- Chequered racing flag elements in the corners -->
  <g opacity="0.25" fill="#FFFFFF">
    <rect x="60" y="40" width="20" height="20"/>
    <rect x="100" y="40" width="20" height="20"/>
    <rect x="80" y="60" width="20" height="20"/>
    <rect x="120" y="60" width="20" height="20"/>

    <rect x="460" y="40" width="20" height="20"/>
    <rect x="500" y="40" width="20" height="20"/>
    <rect x="440" y="60" width="20" height="20"/>
    <rect x="480" y="60" width="20" height="20"/>
  </g>

  <!-- Ayrton Senna Character / Iconic Helmet & Racing Suit -->
  <g filter="url(#sennaShadow)">
    
    <!-- Red Racing Suit (Macacão Vermelho Nacional / Marlboro style) -->
    <path d="M 170 480 Q 300 450 430 480 L 460 580 L 140 580 Z" fill="url(#redSuit)" stroke="#1A1A1A" stroke-width="4"/>
    <!-- Collar -->
    <path d="M 230 440 L 370 440 L 350 490 L 250 490 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    <text x="300" y="475" font-family="'Impact', sans-serif" font-size="20" font-weight="900" fill="#0D47A1" text-anchor="middle" letter-spacing="1">NACIONAL</text>

    <!-- Racing Helmet Base (Iconic Vibrant Yellow) -->
    <ellipse cx="300" cy="270" rx="145" ry="160" fill="url(#helmetYellow)" stroke="#1A1A1A" stroke-width="5"/>

    <!-- Green Stripe (Brasil) -->
    <path d="M 160 250 C 230 230, 370 230, 440 250 L 442 272 C 370 252, 230 252, 158 272 Z" fill="#008837" stroke="#1A1A1A" stroke-width="2"/>

    <!-- Blue Stripe (Brasil) -->
    <path d="M 158 272 C 230 252, 370 252, 442 272 L 440 294 C 370 274, 230 274, 160 294 Z" fill="#002776" stroke="#1A1A1A" stroke-width="2"/>

    <!-- Visor Window (Dark tinted / reflective) -->
    <path d="M 180 295 C 230 275, 370 275, 420 295 C 430 355, 370 375, 300 375 C 230 375, 170 355, 180 295 Z" 
          fill="url(#visorTint)" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Visor Glare / Reflection -->
    <path d="M 205 305 Q 300 290 395 305 L 385 320 Q 300 305 215 320 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- Visor Top White Banner ("SENNA" / Sponsor strip) -->
    <path d="M 182 290 C 230 272, 370 272, 418 290 L 416 308 C 370 290, 230 290, 184 308 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
    <text x="300" y="303" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#B71C1C" text-anchor="middle" letter-spacing="3">SENNA</text>

    <!-- Chin Air Intakes / Grille -->
    <rect x="270" y="390" width="60" height="22" rx="6" fill="#212121" stroke="#1A1A1A" stroke-width="3"/>
    <line x1="285" y1="395" x2="285" y2="407" stroke="#9E9E9E" stroke-width="2.5"/>
    <line x1="300" y1="395" x2="300" y2="407" stroke="#9E9E9E" stroke-width="2.5"/>
    <line x1="315" y1="395" x2="315" y2="407" stroke="#9E9E9E" stroke-width="2.5"/>

    <!-- 3 World Champion Stars on top of Helmet -->
    <g transform="translate(250, 140)">
      <polygon points="15,2 19,10 28,11 21,17 23,26 15,21 7,26 9,17 2,11 11,10" fill="#FFD700" stroke="#1A1A1A" stroke-width="1.5"/>
    </g>
    <g transform="translate(285, 130)">
      <polygon points="15,2 19,10 28,11 21,17 23,26 15,21 7,26 9,17 2,11 11,10" fill="#FFD700" stroke="#1A1A1A" stroke-width="1.5"/>
    </g>
    <g transform="translate(320, 140)">
      <polygon points="15,2 19,10 28,11 21,17 23,26 15,21 7,26 9,17 2,11 11,10" fill="#FFD700" stroke="#1A1A1A" stroke-width="1.5"/>
    </g>

  </g>

  <!-- Cinema Star Badges / Subtitle Banner -->
  <g transform="translate(0, 520)">
    <rect x="70" y="0" width="460" height="52" rx="26" fill="#1A1A1A" stroke="#FDD835" stroke-width="3.5"/>
    <text x="300" y="34" font-family="'Baloo 2', 'Impact', sans-serif" font-size="22" font-weight="900" fill="#FDD835" text-anchor="middle" letter-spacing="2">
      ★ HOMENAGEM AYRTON SENNA ★
    </text>
  </g>
</svg>
