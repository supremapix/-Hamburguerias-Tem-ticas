<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgChase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0F2447"/>
    </linearGradient>
    <linearGradient id="policeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="furBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5B28"/>
      <stop offset="100%" stop-color="#5D3A1A"/>
    </linearGradient>
    <linearGradient id="furTan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D2A9"/>
      <stop offset="100%" stop-color="#DEB887"/>
    </linearGradient>
    <linearGradient id="badgeGoldChase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="pupilAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#4A260D"/>
    </linearGradient>
    <filter id="charShadowChase" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgChase)"/>
  
  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.3">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Blue Stage Light Glow -->
  <circle cx="300" cy="270" r="230" fill="#1E88E5" opacity="0.18"/>
  <circle cx="300" cy="270" r="150" fill="#FFB800" opacity="0.12"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#charShadowChase)">
    
    <!-- German Shepherd Pointy Ears (Behind Head) -->
    <!-- Left Ear -->
    <path d="M190 190 L110 90 C95 70, 130 50, 155 75 L225 180 Z" fill="url(#furBrown)" stroke="#1A1A1A" stroke-width="8"/>
    <path d="M180 180 L125 100 C118 90, 138 78, 150 90 L205 175 Z" fill="url(#furTan)" stroke="#1A1A1A" stroke-width="3"/>

    <!-- Right Ear -->
    <path d="M410 190 L490 90 C505 70, 470 50, 445 75 L375 180 Z" fill="url(#furBrown)" stroke="#1A1A1A" stroke-width="8"/>
    <path d="M420 180 L475 100 C482 90, 462 78, 450 90 L395 175 Z" fill="url(#furTan)" stroke="#1A1A1A" stroke-width="3"/>

    <!-- Police Uniform Vest / Shoulders -->
    <path d="M190 420 L150 520 L450 520 L410 420 Z" fill="url(#policeBlue)" stroke="#1A1A1A" stroke-width="9"/>
    <!-- Yellow Police Trim & Zipper -->
    <path d="M190 420 L210 520 M410 420 L390 520" stroke="#FFD54F" stroke-width="8"/>
    <path d="M150 485 L450 485" stroke="#FFD54F" stroke-width="10"/>
    
    <!-- German Shepherd Brown Neck -->
    <rect x="250" y="380" width="100" height="60" rx="15" fill="url(#furBrown)" stroke="#1A1A1A" stroke-width="7"/>
    <!-- Blue Pup Collar -->
    <rect x="235" y="415" width="130" height="20" rx="10" fill="#0D47A1" stroke="#1A1A1A" stroke-width="5"/>
    
    <!-- Police Pup Tag Badge (Star with Paw) -->
    <g transform="translate(300, 455)">
      <polygon points="0,-26 25,0 0,32 -25,0" fill="#ECEFF1" stroke="#1A1A1A" stroke-width="4"/>
      <circle cx="0" cy="3" r="15" fill="#1565C0"/>
      <!-- Star Emblem -->
      <polygon points="0,-7 3,-1 9,-1 4,3 6,9 0,5 -6,9 -4,3 -9,-1 -3,-1" fill="url(#badgeGoldChase)"/>
    </g>

    <!-- Head (Brown Fur) -->
    <path d="M195 240 C185 150, 415 150, 405 240 C415 340, 390 400, 300 400 C210 400, 185 340, 195 240 Z" fill="url(#furBrown)" stroke="#1A1A1A" stroke-width="9"/>

    <!-- Tan Markings on Muzzle & Cheeks -->
    <path d="M220 280 C210 370, 390 370, 380 280 C360 250, 240 250, 220 280 Z" fill="url(#furTan)" stroke="#1A1A1A" stroke-width="7"/>

    <!-- Cute German Shepherd Nose -->
    <path d="M275 275 C275 265, 325 265, 325 275 C325 298, 308 308, 300 308 C292 308, 275 298, 275 275 Z" fill="#1A1A1A"/>
    <!-- Nose Highlight -->
    <ellipse cx="290" cy="272" rx="6" ry="3" fill="#FFFFFF"/>

    <!-- Happy Confident Smile -->
    <path d="M265 315 Q300 325, 335 315" stroke="#1A1A1A" stroke-width="5" fill="none"/>
    <path d="M272 320 Q300 360, 328 320 Z" fill="#C2185B" stroke="#1A1A1A" stroke-width="5"/>
    <path d="M280 332 Q300 360, 320 332 Z" fill="#FF80AB"/>

    <!-- Whiskers / Dots -->
    <circle cx="250" cy="295" r="3.5" fill="#5D3A1A"/>
    <circle cx="242" cy="305" r="3.5" fill="#5D3A1A"/>
    <circle cx="350" cy="295" r="3.5" fill="#5D3A1A"/>
    <circle cx="358" cy="305" r="3.5" fill="#5D3A1A"/>

    <!-- Big Warm Expressive Eyes -->
    <!-- Left Eye -->
    <ellipse cx="252" cy="230" rx="24" ry="29" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="7"/>
    <circle cx="256" cy="230" r="16" fill="url(#pupilAmber)"/>
    <circle cx="258" cy="230" r="10" fill="#1A1A1A"/>
    <circle cx="253" cy="223" r="5" fill="#FFFFFF"/>
    <circle cx="262" cy="237" r="2.5" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="348" cy="230" rx="24" ry="29" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="7"/>
    <circle cx="344" cy="230" r="16" fill="url(#pupilAmber)"/>
    <circle cx="342" cy="230" r="10" fill="#1A1A1A"/>
    <circle cx="338" cy="223" r="5" fill="#FFFFFF"/>
    <circle cx="347" cy="237" r="2.5" fill="#FFFFFF"/>

    <!-- Brave / Confident Eyebrows (Tan spots above eyes) -->
    <ellipse cx="240" cy="188" rx="14" ry="8" fill="url(#furTan)" stroke="#1A1A1A" stroke-width="3"/>
    <ellipse cx="360" cy="188" rx="14" ry="8" fill="url(#furTan)" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M225 185 Q245 175, 265 185" stroke="#4A260D" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M335 185 Q355 175, 375 185" stroke="#4A260D" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Police Hat (Chase's Iconic Blue Cap) -->
    <g id="police-hat">
      <!-- Cap Crown -->
      <path d="M190 165 C180 75, 420 75, 410 165 Z" fill="url(#policeBlue)" stroke="#1A1A1A" stroke-width="9"/>
      <!-- Cap Black Band -->
      <path d="M175 160 C230 145, 370 145, 425 160 L428 180 C370 165, 230 165, 172 180 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="4"/>
      <!-- Gold Cord across band -->
      <path d="M185 170 Q300 158, 415 170" stroke="#FFD54F" stroke-width="5" fill="none"/>

      <!-- Cap Visor / Bill (Black Glossy) -->
      <path d="M140 172 C220 140, 380 140, 460 172 C475 190, 440 205, 300 205 C160 205, 125 190, 140 172 Z" fill="#212121" stroke="#1A1A1A" stroke-width="8"/>
      <!-- Visor Edge Highlight -->
      <path d="M165 182 Q300 210, 435 182" stroke="#424242" stroke-width="4" fill="none"/>

      <!-- Golden Police Star Badge on Cap -->
      <g transform="translate(300, 125)">
        <polygon points="0,-36 28,-14 22,30 0,38 -22,30 -28,-14" fill="url(#badgeGoldChase)" stroke="#1A1A1A" stroke-width="5"/>
        <polygon points="0,-28 20,-10 16,24 0,30 -16,24 -20,-10" fill="#0D47A1" stroke="#1A1A1A" stroke-width="3"/>
        <!-- Star Icon -->
        <polygon points="0,-18 4,-4 18,-4 7,4 11,18 0,10 -11,18 -7,4 -18,-4 -4,-4" fill="url(#badgeGoldChase)"/>
      </g>
    </g>

  </g>

  <!-- Cinema Title Banner: CHASE • PATRULHA CANINA -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#1976D2" stroke="#1A1A1A" stroke-width="8"/>
    <rect x="6" y="6" width="488" height="48" rx="24" fill="#0D47A1"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
      👮 CHASE • PATRULHA CANINA
    </text>
  </g>
</svg>
