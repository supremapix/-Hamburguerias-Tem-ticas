<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgBuzz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1032"/>
      <stop offset="60%" stop-color="#110A24"/>
      <stop offset="100%" stop-color="#080414"/>
    </linearGradient>
    <linearGradient id="armorWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <linearGradient id="armorGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="hoodPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="skinToneBuzz" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <filter id="charShadowBuzz" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgBuzz)"/>

  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Glowing Cosmic Nebula & Starlight Aura -->
  <circle cx="300" cy="220" r="210" fill="#84CC16" opacity="0.12"/>
  <circle cx="300" cy="220" r="150" fill="#A855F7" opacity="0.15"/>
  <!-- Space Stars -->
  <circle cx="150" cy="90" r="2" fill="#FFFFFF"/>
  <circle cx="450" cy="80" r="3" fill="#FFFFFF"/>
  <circle cx="120" cy="260" r="2.5" fill="#FFFFFF"/>
  <circle cx="480" cy="300" r="2" fill="#FFFFFF"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#charShadowBuzz)">
    <!-- White Space Suit Torso & Shoulders -->
    <path d="M110 500 C115 410, 180 370, 300 370 C420 370, 485 410, 490 500 Z" fill="url(#armorWhite)" stroke="#1A1A1A" stroke-width="8"/>
    
    <!-- Lime Green Chestplate Armor -->
    <path d="M160 380 C210 355, 390 355, 440 380 L445 460 C380 485, 220 485, 155 460 Z" fill="url(#armorGreen)" stroke="#1A1A1A" stroke-width="7"/>

    <!-- Lightyear Space Ranger Badge (Left Chest) -->
    <g transform="translate(225, 410)">
      <polygon points="0,-18 20,-6 14,18 -14,18 -20,-6" fill="#0284C7" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Gold Star in badge -->
      <polygon points="0,-12 4,-2 13,-2 6,4 9,14 0,8 -9,14 -6,4 -13,-2 -4,-2" fill="#FACC15"/>
    </g>

    <!-- Three Right Chest Oval Buttons: Blue, Green, Red -->
    <g transform="translate(345, 400)">
      <ellipse cx="0" cy="0" rx="14" ry="9" fill="#0284C7" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="34" cy="0" rx="14" ry="9" fill="#22C55E" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="68" cy="0" rx="14" ry="9" fill="#EF4444" stroke="#1A1A1A" stroke-width="3"/>
    </g>

    <!-- Red Laser Button on Shoulder Strip -->
    <circle cx="460" cy="435" r="14" fill="#EF4444" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Neck Ring Collar (Glass Helmet Base) -->
    <path d="M190 340 C220 325, 380 325, 410 340 L400 375 C360 385, 240 385, 200 375 Z" fill="#E5E7EB" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Glass Helmet Dome Silhouette / Highlight Glow -->
    <path d="M175 320 C140 160, 460 160, 425 320" fill="none" stroke="#67E8F9" stroke-width="6" opacity="0.6"/>
    <path d="M195 280 C180 180, 420 180, 405 280" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>

    <!-- Purple Space Balaclava / Hood -->
    <ellipse cx="300" cy="225" rx="100" ry="115" fill="url(#hoodPurple)" stroke="#1A1A1A" stroke-width="8"/>

    <!-- Face Shape (Strong Chiseled Hero Jaw) -->
    <path d="M225 210 C220 280, 240 315, 300 325 C360 315, 380 280, 375 210 C370 170, 230 170, 225 210 Z" fill="url(#skinToneBuzz)" stroke="#1A1A1A" stroke-width="7"/>

    <!-- Thick Brown Determined Eyebrows -->
    <path d="M240 190 Q265 175, 285 190" stroke="#583101" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M315 190 Q335 175, 360 190" stroke="#583101" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Blue-Hazel Heroic Eyes) -->
    <ellipse cx="265" cy="210" rx="16" ry="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="268" cy="210" r="8" fill="#0284C7"/>
    <circle cx="268" cy="210" r="4" fill="#1A1A1A"/>
    <circle cx="270" cy="208" r="2" fill="#FFFFFF"/>

    <ellipse cx="335" cy="210" rx="16" ry="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="332" cy="210" r="8" fill="#0284C7"/>
    <circle cx="332" cy="210" r="4" fill="#1A1A1A"/>
    <circle cx="334" cy="208" r="2" fill="#FFFFFF"/>

    <!-- Strong Nose -->
    <path d="M300 205 L295 240 L308 240" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Smirking Confident Mouth -->
    <path d="M270 262 Q300 278, 335 258" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Iconic Chin Swirl / Cleft (Buzz's Signature) -->
    <path d="M295 290 Q305 285, 305 295 Q305 305, 296 300" stroke="#854D0E" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cinema Title Banner: BUZZ LIGHTYEAR -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#84CC16" stroke="#1A1A1A" stroke-width="8"/>
    <rect x="6" y="6" width="488" height="48" rx="24" fill="#6B21A8"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="25" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
      🚀 PERSONAGEM BUZZ LIGHTYEAR
    </text>
  </g>
</svg>
