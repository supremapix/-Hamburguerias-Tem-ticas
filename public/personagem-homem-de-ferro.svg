<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgIron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B0B"/>
      <stop offset="50%" stop-color="#190707"/>
      <stop offset="100%" stop-color="#0A0303"/>
    </linearGradient>
    <linearGradient id="ironRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="ironGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="arcReactorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="charShadowIron" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEyes" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgIron)"/>

  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Glowing Stage Spotlight from Arc Reactor & Eyes -->
  <circle cx="300" cy="240" r="210" fill="#EF4444" opacity="0.15"/>
  <circle cx="300" cy="440" r="140" fill="#06B6D4" opacity="0.15"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#charShadowIron)">
    <!-- Red Armored Shoulders & Torso -->
    <path d="M120 495 C130 405, 190 375, 300 375 C410 375, 470 405, 480 495 Z" fill="url(#ironRed)" stroke="#1A1A1A" stroke-width="8"/>
    
    <!-- Gold Shoulder Accents -->
    <path d="M120 495 C130 435, 170 410, 205 405 L195 495 Z" fill="url(#ironGold)" stroke="#1A1A1A" stroke-width="6"/>
    <path d="M480 495 C470 435, 430 410, 395 405 L405 495 Z" fill="url(#ironGold)" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Glowing Arc Reactor on Chest -->
    <g transform="translate(300, 440)">
      <!-- Outer Metal Casing -->
      <circle cx="0" cy="0" r="32" fill="#1A1A1A" stroke="#CA8A04" stroke-width="4"/>
      <circle cx="0" cy="0" r="26" fill="#0E7490"/>
      <!-- Concentric Glowing Light Core -->
      <circle cx="0" cy="0" r="20" fill="url(#arcReactorGlow)" filter="url(#glowEyes)"/>
      <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
      <!-- Reactor segments -->
      <path d="M0 -24 L0 24 M-24 0 L24 0" stroke="#0891B2" stroke-width="3"/>
    </g>

    <!-- Armored Neck -->
    <rect x="250" y="325" width="100" height="65" rx="6" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="4"/>
    <line x1="265" y1="345" x2="335" y2="345" stroke="#991B1B" stroke-width="4"/>
    <line x1="265" y1="365" x2="335" y2="365" stroke="#991B1B" stroke-width="4"/>

    <!-- Red Helmet Dome (Outer Shell) -->
    <path d="M185 220 C180 110, 420 110, 415 220 C420 310, 375 350, 300 350 C225 350, 180 310, 185 220 Z" fill="url(#ironRed)" stroke="#1A1A1A" stroke-width="8"/>

    <!-- Red Helmet Cheek Flares -->
    <path d="M185 240 L165 290 L210 330 Z" fill="url(#ironRed)" stroke="#1A1A1A" stroke-width="6"/>
    <path d="M415 240 L435 290 L390 330 Z" fill="url(#ironRed)" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Gold Faceplate -->
    <path d="M215 155 L385 155 L395 245 L365 255 L375 330 L300 345 L225 330 L235 255 L205 245 Z" fill="url(#ironGold)" stroke="#1A1A1A" stroke-width="7"/>

    <!-- Faceplate Brow Chisel Line -->
    <path d="M225 190 L300 215 L375 190" stroke="#1A1A1A" stroke-width="5" fill="none"/>

    <!-- Glowing Cyan/White LED Slit Eyes -->
    <polygon points="235,225 285,235 282,245 240,240" fill="#E0F2FE" stroke="#0891B2" stroke-width="2.5" filter="url(#glowEyes)"/>
    <polygon points="238,227 282,235 280,242 242,238" fill="#FFFFFF"/>

    <polygon points="365,225 315,235 318,245 360,240" fill="#E0F2FE" stroke="#0891B2" stroke-width="2.5" filter="url(#glowEyes)"/>
    <polygon points="362,227 318,235 320,242 358,238" fill="#FFFFFF"/>

    <!-- Nose / Cheek Geometric Seams -->
    <path d="M275 255 L275 290 L325 290 L325 255" stroke="#1A1A1A" stroke-width="4" fill="none"/>
    <path d="M255 310 L345 310" stroke="#1A1A1A" stroke-width="4"/>
    <!-- Mouth / Chin Vent Slot -->
    <line x1="280" y1="322" x2="320" y2="322" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Cinema Title Banner: HOMEM DE FERRO -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#EF4444" stroke="#1A1A1A" stroke-width="8"/>
    <rect x="6" y="6" width="488" height="48" rx="24" fill="#B91C1C"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#FEF08A" letter-spacing="2">
      🦾 HOMEM DE FERRO
    </text>
  </g>
</svg>
