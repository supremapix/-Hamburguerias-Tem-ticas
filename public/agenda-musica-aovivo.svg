<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgLiveMusic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140727"/>
      <stop offset="50%" stop-color="#280A3C"/>
      <stop offset="100%" stop-color="#3D1308"/>
    </linearGradient>
    <linearGradient id="guitarWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FF8A65"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="guitarEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1500"/>
    </linearGradient>
    <linearGradient id="goldMic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="musicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgLiveMusic)"/>
  
  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Stage Concert Lights Glowing from Top Corners -->
  <polygon points="50,0 200,0 350,550 50,550" fill="#E91E63" opacity="0.12"/>
  <polygon points="550,0 400,0 250,550 550,550" fill="#FFC107" opacity="0.15"/>
  <circle cx="300" cy="270" r="210" fill="#BA68C8" opacity="0.12"/>

  <!-- Musical Notes Floating Around -->
  <g fill="#FFD54F" opacity="0.8">
    <!-- Note 1 -->
    <path d="M 120 180 L 150 170 L 150 210 L 120 220 Z"/>
    <circle cx="120" cy="225" r="14"/>
    <circle cx="150" cy="215" r="14"/>
    <line x1="120" y1="180" x2="120" y2="225" stroke="#FFD54F" stroke-width="4"/>
    <line x1="150" y1="170" x2="150" y2="215" stroke="#FFD54F" stroke-width="4"/>

    <!-- Note 2 -->
    <circle cx="470" cy="200" r="14"/>
    <line x1="482" y1="200" x2="482" y2="150" stroke="#FFD54F" stroke-width="4"/>
    <path d="M 482 150 Q 500 160 505 175" fill="none" stroke="#FFD54F" stroke-width="4" stroke-linecap="round"/>

    <!-- Small Sparkles -->
    <polygon points="170,120 174,130 184,134 174,138 170,148 166,138 156,134 166,130" fill="#FFF"/>
    <polygon points="420,110 424,120 434,124 424,128 420,138 416,128 406,124 416,120" fill="#FFF"/>
  </g>

  <!-- Acoustic Guitar & Stage Microphone Group -->
  <g filter="url(#musicShadow)">

    <!-- Acoustic Guitar Body (angled) -->
    <g transform="translate(300, 310) rotate(-22)">
      
      <!-- Guitar Neck & Headstock -->
      <rect x="-18" y="-270" width="36" height="200" fill="#5D4037" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Fret lines -->
      <line x1="-18" y1="-230" x2="18" y2="-230" stroke="#BCAAA4" stroke-width="2.5"/>
      <line x1="-18" y1="-190" x2="18" y2="-190" stroke="#BCAAA4" stroke-width="2.5"/>
      <line x1="-18" y1="-150" x2="18" y2="-150" stroke="#BCAAA4" stroke-width="2.5"/>
      <line x1="-18" y1="-110" x2="18" y2="-110" stroke="#BCAAA4" stroke-width="2.5"/>

      <!-- Headstock -->
      <polygon points="-24,-330 24,-330 20,-270 -20,-270" fill="#3E2723" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Tuning Pegs -->
      <circle cx="-32" cy="-315" r="7" fill="#FFD54F" stroke="#1A1A1A" stroke-width="2"/>
      <circle cx="-32" cy="-290" r="7" fill="#FFD54F" stroke="#1A1A1A" stroke-width="2"/>
      <circle cx="32" cy="-315" r="7" fill="#FFD54F" stroke="#1A1A1A" stroke-width="2"/>
      <circle cx="32" cy="-290" r="7" fill="#FFD54F" stroke="#1A1A1A" stroke-width="2"/>

      <!-- Guitar Lower Body -->
      <ellipse cx="0" cy="70" rx="100" ry="110" fill="url(#guitarWood)" stroke="url(#guitarEdge)" stroke-width="8"/>
      <!-- Guitar Upper Body -->
      <ellipse cx="0" cy="-30" rx="75" ry="75" fill="url(#guitarWood)" stroke="url(#guitarEdge)" stroke-width="8"/>
      <!-- Waist Insets to create 8-shape -->
      <path d="M -75 -30 C -50 15, -50 25, -100 70 L 100 70 C 50 25, 50 15, 75 -30 Z" fill="url(#guitarWood)"/>

      <!-- Sound Hole (Boca do Violão) -->
      <circle cx="0" cy="10" r="34" fill="#1A1A1A" stroke="#FFD54F" stroke-width="5"/>
      <circle cx="0" cy="10" r="28" fill="#000000"/>

      <!-- Bridge (Cavalete) -->
      <rect x="-42" y="100" width="84" height="22" rx="4" fill="#3E2723" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Bridge pins -->
      <circle cx="-25" cy="111" r="3" fill="#FFF"/>
      <circle cx="-10" cy="111" r="3" fill="#FFF"/>
      <circle cx="5" cy="111" r="3" fill="#FFF"/>
      <circle cx="20" cy="111" r="3" fill="#FFF"/>

      <!-- Strings -->
      <line x1="-8" y1="-320" x2="-8" y2="105" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
      <line x1="-3" y1="-320" x2="-3" y2="105" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
      <line x1="2" y1="-320" x2="2" y2="105" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
      <line x1="7" y1="-320" x2="7" y2="105" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

    </g>

    <!-- Vintage Chrome / Gold Stage Microphone -->
    <g transform="translate(370, 220) rotate(15)">
      <!-- Mic Stand -->
      <line x1="0" y1="90" x2="0" y2="280" stroke="#757575" stroke-width="8" stroke-linecap="round"/>
      <rect x="-8" y="80" width="16" height="30" rx="4" fill="#424242"/>

      <!-- Microphone Head (Vintage 50s Shure style) -->
      <ellipse cx="0" cy="35" rx="36" ry="46" fill="url(#goldMic)" stroke="#1A1A1A" stroke-width="4"/>
      <!-- Grille ribbing -->
      <line x1="-30" y1="20" x2="30" y2="20" stroke="#3E2723" stroke-width="3"/>
      <line x1="-35" y1="35" x2="35" y2="35" stroke="#3E2723" stroke-width="3.5"/>
      <line x1="-30" y1="50" x2="30" y2="50" stroke="#3E2723" stroke-width="3"/>
      <!-- Vertical rib -->
      <line x1="0" y1="-5" x2="0" y2="75" stroke="#3E2723" stroke-width="4"/>
    </g>

  </g>

  <!-- Cinema Banner at bottom -->
  <g transform="translate(0, 515)">
    <rect x="50" y="0" width="500" height="58" rx="29" fill="#1A1A1A" stroke="#FFB800" stroke-width="3.5"/>
    <text x="300" y="27" font-family="'Impact', 'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#FFB800" text-anchor="middle" letter-spacing="1.5">
      MÚSICA AO VIVO • SÁBADO
    </text>
    <text x="300" y="47" font-family="'Baloo 2', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      PAULINHO GOUVÊA
    </text>
  </g>
</svg>
