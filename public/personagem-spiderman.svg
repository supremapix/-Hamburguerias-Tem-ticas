<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgSpidey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#1A1528"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="spideyRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="spideyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="eyeLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <filter id="charShadowSpidey" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgSpidey)"/>

  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.3">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Red & Blue Atmospheric Stage Glows -->
  <circle cx="200" cy="240" r="190" fill="#FF3B30" opacity="0.18"/>
  <circle cx="400" cy="240" r="190" fill="#1E88E5" opacity="0.18"/>
  <circle cx="300" cy="260" r="130" fill="#FFB800" opacity="0.12"/>

  <!-- Character Spider-Man with Shadow -->
  <g filter="url(#charShadowSpidey)">

    <!-- Shoulders & Upper Torso -->
    <path d="M120 490 C125 410, 200 390, 300 390 C400 390, 475 410, 480 490 Z" fill="url(#spideyRed)" stroke="#1A1A1A" stroke-width="8"/>
    
    <!-- Blue Torso Flanks -->
    <path d="M120 490 C125 425, 175 410, 205 405 L190 490 Z" fill="url(#spideyBlue)" stroke="#1A1A1A" stroke-width="6"/>
    <path d="M480 490 C475 425, 425 410, 395 405 L410 490 Z" fill="url(#spideyBlue)" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Spider Emblem on Chest -->
    <g transform="translate(300, 440)">
      <ellipse cx="0" cy="0" rx="7" ry="14" fill="#1A1A1A"/>
      <!-- Legs Top -->
      <path d="M-5 -6 Q-25 -20 -35 -10 M-5 -2 Q-28 -8 -40 6 M5 -6 Q25 -20 35 -10 M5 -2 Q28 -8 40 6" stroke="#1A1A1A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <!-- Legs Bottom -->
      <path d="M-5 4 Q-25 18 -32 30 M-4 8 Q-18 26 -22 38 M5 4 Q25 18 32 30 M4 8 Q18 26 22 38" stroke="#1A1A1A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Torso Web Lines -->
    <path d="M300 390 L300 490" stroke="#1A1A1A" stroke-width="4"/>
    <path d="M250 393 L235 490" stroke="#1A1A1A" stroke-width="4"/>
    <path d="M350 393 L365 490" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Neck -->
    <path d="M255 350 L250 405 L350 405 L345 350 Z" fill="url(#spideyRed)" stroke="#1A1A1A" stroke-width="7"/>

    <!-- Head / Mask Base -->
    <ellipse cx="300" cy="235" rx="135" ry="160" fill="url(#spideyRed)" stroke="#1A1A1A" stroke-width="9"/>

    <!-- Web Lines Radiating from Mask Center (Between Eyes) -->
    <!-- Radial Lines -->
    <path d="M300 235 L300 75" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L355 82" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L405 110" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L430 160" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L435 235" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L420 310" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L375 370" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L300 395" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L225 370" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L180 310" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L165 235" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L170 160" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L195 110" stroke="#1A1A1A" stroke-width="4.5"/>
    <path d="M300 235 L245 82" stroke="#1A1A1A" stroke-width="4.5"/>

    <!-- Concentric Web Arcs (Convex towards center) -->
    <!-- Inner Rings -->
    <path d="M275 195 Q300 185 325 195" stroke="#1A1A1A" stroke-width="4" fill="none"/>
    <path d="M255 165 Q300 150 345 165" stroke="#1A1A1A" stroke-width="4" fill="none"/>
    <path d="M235 135 Q300 115 365 135" stroke="#1A1A1A" stroke-width="4" fill="none"/>
    <path d="M210 110 Q300 85 390 110" stroke="#1A1A1A" stroke-width="4" fill="none"/>
    
    <!-- Chin Arcs -->
    <path d="M275 275 Q300 285 325 275" stroke="#1A1A1A" stroke-width="4" fill="none"/>
    <path d="M255 310 Q300 325 345 310" stroke="#1A1A1A" stroke-width="4" fill="none"/>
    <path d="M235 345 Q300 365 365 345" stroke="#1A1A1A" stroke-width="4" fill="none"/>
    <path d="M215 375 Q300 400 385 375" stroke="#1A1A1A" stroke-width="4" fill="none"/>

    <!-- Left Eye Mask Outer Contour & Lens -->
    <!-- Bold Black Border Frame -->
    <path d="M285 240 C280 205, 230 180, 185 200 C175 240, 205 285, 280 262 Z" fill="#1A1A1A"/>
    <!-- Eye White Lens -->
    <path d="M278 238 C273 212, 232 192, 195 208 C188 238, 212 274, 273 255 Z" fill="url(#eyeLens)"/>
    <!-- Eye Inner Lens Highlight -->
    <path d="M260 216 Q235 205, 210 215" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.9"/>

    <!-- Right Eye Mask Outer Contour & Lens -->
    <!-- Bold Black Border Frame -->
    <path d="M315 240 C320 205, 370 180, 415 200 C425 240, 395 285, 320 262 Z" fill="#1A1A1A"/>
    <!-- Eye White Lens -->
    <path d="M322 238 C327 212, 368 192, 405 208 C412 238, 388 274, 327 255 Z" fill="url(#eyeLens)"/>
    <!-- Eye Inner Lens Highlight -->
    <path d="M340 216 Q365 205, 390 215" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.9"/>

    <!-- Spider Hanging Web Strand from Top Right Corner -->
    <path d="M530 0 L480 120" stroke="#FFFFFF" stroke-width="3" opacity="0.5"/>
    <circle cx="480" cy="120" r="4" fill="#FFFFFF" opacity="0.7"/>

  </g>

  <!-- Cinema Title Banner: HOMEM ARANHA -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#FF3B30" stroke="#1A1A1A" stroke-width="8"/>
    <rect x="6" y="6" width="488" height="48" rx="24" fill="#0D47A1"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
      🕷️ HOMEM ARANHA
    </text>
  </g>
</svg>
