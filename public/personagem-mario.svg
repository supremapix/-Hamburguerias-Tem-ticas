<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgMario" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="60%" stop-color="#3A1515"/>
      <stop offset="100%" stop-color="#550A0A"/>
    </linearGradient>
    <linearGradient id="capRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3333"/>
      <stop offset="100%" stop-color="#C41212"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="100%" stop-color="#F6C39B"/>
    </linearGradient>
    <linearGradient id="overallsBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="marioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgMario)"/>
  
  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Glowing Aura / Halo -->
  <circle cx="300" cy="280" r="230" fill="#FF3333" opacity="0.2"/>
  <circle cx="300" cy="280" r="160" fill="#FFD54F" opacity="0.15"/>

  <!-- Cinema Star Icons in background -->
  <path d="M 120 120 L 125 135 L 140 135 L 128 145 L 132 160 L 120 150 L 108 160 L 112 145 L 100 135 L 115 135 Z" fill="url(#goldStar)" opacity="0.7"/>
  <path d="M 480 130 L 485 145 L 500 145 L 488 155 L 492 170 L 480 160 L 468 170 L 472 155 L 460 145 L 475 145 Z" fill="url(#goldStar)" opacity="0.7"/>

  <!-- Mario Character Illustration Group -->
  <g filter="url(#marioShadow)">
    
    <!-- Red Shirt / Chest -->
    <path d="M 180 500 Q 300 460 420 500 L 440 580 L 160 580 Z" fill="url(#capRed)"/>

    <!-- Blue Overalls Straps & Yellow Buttons -->
    <path d="M 210 470 L 255 470 L 255 580 L 210 580 Z" fill="url(#overallsBlue)"/>
    <circle cx="232" cy="510" r="14" fill="#FFD54F" stroke="#1A1A1A" stroke-width="3"/>
    
    <path d="M 345 470 L 390 470 L 390 580 L 345 580 Z" fill="url(#overallsBlue)"/>
    <circle cx="368" cy="510" r="14" fill="#FFD54F" stroke="#1A1A1A" stroke-width="3"/>

    <!-- Neck / Collar -->
    <path d="M 250 420 Q 300 450 350 420 L 350 470 L 250 470 Z" fill="url(#skinTone)"/>

    <!-- Ears -->
    <circle cx="190" cy="320" r="32" fill="url(#skinTone)" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="410" cy="320" r="32" fill="url(#skinTone)" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Hair sideburns (brown) -->
    <path d="M 185 300 C 175 340, 205 380, 225 365 C 220 340, 200 310, 185 300 Z" fill="#4E342E" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M 415 300 C 425 340, 395 380, 375 365 C 380 340, 400 310, 415 300 Z" fill="#4E342E" stroke="#1A1A1A" stroke-width="3"/>

    <!-- Face (Head) -->
    <ellipse cx="300" cy="330" rx="115" ry="105" fill="url(#skinTone)" stroke="#1A1A1A" stroke-width="5"/>

    <!-- Big Eyes -->
    <!-- Left Eye -->
    <ellipse cx="265" cy="285" rx="20" ry="28" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
    <ellipse cx="270" cy="285" rx="12" ry="18" fill="#1976D2"/>
    <ellipse cx="272" cy="285" rx="7" ry="12" fill="#0D47A1"/>
    <circle cx="268" cy="278" r="5" fill="#FFFFFF"/>
    
    <!-- Right Eye -->
    <ellipse cx="335" cy="285" rx="20" ry="28" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
    <ellipse cx="330" cy="285" rx="12" ry="18" fill="#1976D2"/>
    <ellipse cx="328" cy="285" rx="7" ry="12" fill="#0D47A1"/>
    <circle cx="332" cy="278" r="5" fill="#FFFFFF"/>

    <!-- Eyebrows (Black / Brown arcs) -->
    <path d="M 240 250 Q 265 240 285 255" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
    <path d="M 360 250 Q 335 240 315 255" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>

    <!-- Big Mario Nose -->
    <ellipse cx="300" cy="325" rx="38" ry="32" fill="url(#skinTone)" stroke="#1A1A1A" stroke-width="5"/>
    <path d="M 285 315 A 15 15 0 0 1 315 315" fill="none" stroke="#F6C39B" stroke-width="3" opacity="0.6"/>

    <!-- Iconic Mario Mustache -->
    <path d="M 210 370 C 230 350, 270 345, 300 355 C 330 345, 370 350, 390 370 C 375 395, 350 390, 335 378 C 320 395, 300 395, 300 395 C 300 395, 280 395, 265 378 C 250 390, 225 395, 210 370 Z" 
          fill="#212121" stroke="#1A1A1A" stroke-width="4.5"/>

    <!-- Happy Mouth underneath mustache -->
    <path d="M 270 390 Q 300 425 330 390 Z" fill="#B71C1C" stroke="#1A1A1A" stroke-width="3"/>
    <path d="M 280 405 Q 300 395 320 405" fill="#FF8A80"/>

    <!-- Mario Cap Visor / Brim -->
    <path d="M 180 230 C 220 200, 380 200, 420 230 C 420 260, 180 260, 180 230 Z" 
          fill="url(#capRed)" stroke="#1A1A1A" stroke-width="5"/>
    
    <!-- Mario Cap Dome -->
    <path d="M 175 220 C 160 120, 230 90, 300 90 C 370 90, 440 120, 425 220 Z" 
          fill="url(#capRed)" stroke="#1A1A1A" stroke-width="5"/>

    <!-- White Emblem Circle with Red "M" -->
    <ellipse cx="300" cy="155" rx="42" ry="38" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
    <text x="300" y="172" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#E53935" text-anchor="middle">M</text>

  </g>

  <!-- Cinema Star Badges / Subtitle Banner -->
  <g transform="translate(0, 520)">
    <rect x="70" y="0" width="460" height="52" rx="26" fill="#1A1A1A" stroke="#FFB800" stroke-width="3.5"/>
    <text x="300" y="34" font-family="'Baloo 2', 'Impact', sans-serif" font-size="22" font-weight="900" fill="#FFB800" text-anchor="middle" letter-spacing="2">
      ★ PERSONAGEM SUPER MARIO ★
    </text>
  </g>
</svg>
