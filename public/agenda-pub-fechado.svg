<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgFechado" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#241B2B"/>
    </linearGradient>
    <linearGradient id="goldGradFechado" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <filter id="shadowClapboard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgFechado)"/>
  
  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.3">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Ambient Stage Glow -->
  <circle cx="300" cy="260" r="210" fill="#FFB800" opacity="0.12"/>
  <circle cx="300" cy="260" r="140" fill="#7C4DFF" opacity="0.10"/>

  <!-- Cinema Clapboard Group -->
  <g filter="url(#shadowClapboard)">
    
    <!-- Chef Hat behind clapboard -->
    <g transform="translate(300, 110)">
      <path d="M-60,40 C-80,20 -70,-30 -30,-40 C-30,-70 30,-70 30,-40 C70,-30 80,20 60,40 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="7"/>
      <rect x="-45" y="35" width="90" height="24" rx="6" fill="#F5F5F5" stroke="#1A1A1A" stroke-width="5"/>
      <!-- Gold Star on Chef Hat -->
      <polygon points="0,40 3,46 9,46 4,50 6,56 0,52 -6,56 -4,50 -9,46 -3,46" fill="#FFB800"/>
    </g>

    <!-- Main Slanted Clapboard -->
    <g transform="translate(130, 150) rotate(-6)">
      <!-- Top Open Stick -->
      <g transform="translate(0, -35) rotate(-22)">
        <rect x="0" y="0" width="340" height="46" rx="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="5"/>
        <!-- Yellow Chevrons -->
        <polygon points="30,0 60,0 35,46 5,46" fill="#FFB800"/>
        <polygon points="90,0 120,0 95,46 65,46" fill="#FFB800"/>
        <polygon points="150,0 180,0 155,46 125,46" fill="#FFB800"/>
        <polygon points="210,0 240,0 215,46 185,46" fill="#FFB800"/>
        <polygon points="270,0 300,0 275,46 245,46" fill="#FFB800"/>
        <!-- Hinge Pin -->
        <circle cx="20" cy="23" r="10" fill="#E0E0E0" stroke="#1A1A1A" stroke-width="4"/>
      </g>

      <!-- Bottom Body of Slate -->
      <rect x="0" y="0" width="340" height="250" rx="14" fill="#212121" stroke="#1A1A1A" stroke-width="7"/>
      <!-- Top Fixed Chevron Bar -->
      <rect x="0" y="0" width="340" height="46" rx="8" fill="#1A1A1A"/>
      <polygon points="30,0 60,0 35,46 5,46" fill="#FFB800"/>
      <polygon points="90,0 120,0 95,46 65,46" fill="#FFB800"/>
      <polygon points="150,0 180,0 155,46 125,46" fill="#FFB800"/>
      <polygon points="210,0 240,0 215,46 185,46" fill="#FFB800"/>
      <polygon points="270,0 300,0 275,46 245,46" fill="#FFB800"/>

      <!-- Clapboard Text Lines -->
      <text x="170" y="85" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#FFB800" text-anchor="middle" letter-spacing="3">BURGER FILMS</text>
      
      <line x1="20" y1="105" x2="320" y2="105" stroke="#424242" stroke-width="2"/>
      
      <!-- Energy Recharge Box -->
      <g transform="translate(30, 120)">
        <rect x="0" y="0" width="280" height="50" rx="10" fill="#141414" stroke="#FFB800" stroke-width="3"/>
        <rect x="6" y="6" width="268" height="38" rx="6" fill="#2E7D32"/>
        <text x="140" y="32" font-family="'Arial Black', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="900" letter-spacing="1">⚡ ENERGIA 100% CARREGANDO</text>
      </g>

      <!-- Subtitle Details on Board -->
      <text x="170" y="200" font-family="'Arial Black', sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">🎬 BASTIDORES & PREPARO</text>
      <text x="170" y="230" font-family="'Arial', sans-serif" font-size="14" fill="#BDBDBD" text-anchor="middle" font-weight="bold">PRONTOS PARA O FIM DE SEMANA</text>
    </g>

    <!-- Star Badges Floating -->
    <g transform="translate(110, 360)">
      <polygon points="0,-16 4,-4 16,-4 7,4 10,16 0,8 -10,16 -7,4 -16,-4 -4,-4" fill="url(#goldGradFechado)" stroke="#1A1A1A" stroke-width="2"/>
    </g>
    <g transform="translate(480, 200)">
      <polygon points="0,-20 5,-5 20,-5 8,5 12,20 0,10 -12,20 -8,5 -20,-5 -5,-5" fill="url(#goldGradFechado)" stroke="#1A1A1A" stroke-width="2"/>
    </g>

  </g>

  <!-- Cinema Title Banner: QUARTA-FEIRA • INTERVALO ESTELAR -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#FFB800" stroke="#1A1A1A" stroke-width="8"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#1A1A1A" letter-spacing="2">
      🎬 INTERVALO • RECARREGANDO ENERGIAS
    </text>
  </g>
</svg>
