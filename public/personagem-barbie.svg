<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgBarbie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#500724"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="barbiePink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="blondeHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="skinBarbie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <filter id="charShadowBarbie" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgBarbie)"/>

  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Glowing Pink Sparkle Aura & Cinema Stars -->
  <circle cx="300" cy="250" r="210" fill="#EC4899" opacity="0.2"/>
  <circle cx="300" cy="250" r="140" fill="#F472B6" opacity="0.15"/>
  <!-- Sparkles -->
  <path d="M160 120 Q170 120 170 110 Q170 120 180 120 Q170 120 170 130 Q170 120 160 120 Z" fill="#FFFFFF"/>
  <path d="M430 140 Q440 140 440 130 Q440 140 450 140 Q440 140 440 150 Q440 140 430 140 Z" fill="#FDE047"/>
  <path d="M140 320 Q150 320 150 310 Q150 320 160 320 Q150 320 150 330 Q150 320 140 320 Z" fill="#FFFFFF"/>
  <path d="M460 290 Q470 290 470 280 Q470 290 480 290 Q470 290 470 300 Q470 290 460 290 Z" fill="#FFFFFF"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#charShadowBarbie)">
    
    <!-- Blonde High Ponytail (Back layer) -->
    <path d="M350 150 C440 120, 480 220, 450 320 C430 280, 410 230, 370 200 Z" fill="url(#blondeHair)" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Pink Glamour Dress & Shoulders -->
    <path d="M150 495 C160 410, 220 380, 300 380 C380 380, 440 410, 450 495 Z" fill="url(#barbiePink)" stroke="#1A1A1A" stroke-width="7"/>
    
    <!-- Sweetheart Neckline on Dress -->
    <path d="M220 405 Q260 435 300 415 Q340 435 380 405 L375 495 L225 495 Z" fill="#BE185D" stroke="#1A1A1A" stroke-width="5"/>
    <path d="M220 405 Q260 435 300 415 Q340 435 380 405" stroke="#FFFFFF" stroke-width="4" fill="none"/>

    <!-- Pearl/Diamond Glamour Necklace -->
    <path d="M245 375 Q300 405 355 375" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 14" fill="none"/>

    <!-- Elegant Neck -->
    <path d="M270 300 L265 380 L335 380 L330 300 Z" fill="url(#skinBarbie)" stroke="#1A1A1A" stroke-width="5"/>

    <!-- Head / Face Silhouette -->
    <path d="M230 215 C225 285, 250 325, 300 328 C350 325, 375 285, 370 215 C365 155, 235 155, 230 215 Z" fill="url(#skinBarbie)" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="250" cy="265" rx="14" ry="9" fill="#F472B6" opacity="0.6"/>
    <ellipse cx="350" cy="265" rx="14" ry="9" fill="#F472B6" opacity="0.6"/>

    <!-- Big Blue Eyes with Glam Eyelashes -->
    <!-- Left Eye -->
    <ellipse cx="265" cy="225" rx="18" ry="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="267" cy="225" r="9" fill="#0284C7"/>
    <circle cx="267" cy="225" r="4.5" fill="#1A1A1A"/>
    <circle cx="270" cy="222" r="2" fill="#FFFFFF"/>
    <!-- Winged Eyeliner & Lashes -->
    <path d="M245 220 Q265 208 285 220 L290 214" stroke="#1A1A1A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M285 215 L292 210 M275 210 L278 204 M260 211 L258 205" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="335" cy="225" rx="18" ry="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="333" cy="225" r="9" fill="#0284C7"/>
    <circle cx="333" cy="225" r="4.5" fill="#1A1A1A"/>
    <circle cx="336" cy="222" r="2" fill="#FFFFFF"/>
    <!-- Winged Eyeliner & Lashes -->
    <path d="M315 220 Q335 208 355 220 L360 214" stroke="#1A1A1A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M355 215 L362 210 M345 210 L348 204 M330 211 L328 205" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>

    <!-- Delicate Curved Eyebrows -->
    <path d="M248 198 Q268 188 285 198" stroke="#CA8A04" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M315 198 Q332 188 352 198" stroke="#CA8A04" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Dainty Nose -->
    <path d="M298 235 Q302 248 306 248" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Beautiful Pink Smile -->
    <path d="M272 272 Q300 292 328 272" stroke="#1A1A1A" stroke-width="4" fill="#EC4899"/>
    <!-- White Teeth Highlight -->
    <path d="M276 272 Q300 282 324 272 Z" fill="#FFFFFF"/>

    <!-- Glamorous Blonde Bangs & Hairline (Front Layer) -->
    <path d="M225 190 C220 120, 380 120, 375 190 C360 160, 320 165, 300 175 C280 165, 240 160, 225 190 Z" fill="url(#blondeHair)" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Retro Cat-Eye Sunglasses on Head (Barbie Trademark) -->
    <g transform="translate(300, 145)">
      <!-- Frame -->
      <polygon points="-75,-5 -25,-15 -10,10 -60,15" fill="#FFFFFF" stroke="#EC4899" stroke-width="4"/>
      <polygon points="75,-5 25,-15 10,10 60,15" fill="#FFFFFF" stroke="#EC4899" stroke-width="4"/>
      <!-- Bridge -->
      <path d="M-15 0 L15 0" stroke="#EC4899" stroke-width="4"/>
      <!-- Dark Lenses -->
      <polygon points="-68,-2 -30,-10 -18,8 -58,11" fill="#1A1A1A"/>
      <polygon points="68,-2 30,-10 18,8 58,11" fill="#1A1A1A"/>
    </g>

    <!-- Pink Scrunchie on Ponytail -->
    <ellipse cx="360" cy="165" rx="18" ry="12" fill="#EC4899" stroke="#1A1A1A" stroke-width="4"/>

  </g>

  <!-- Cinema Title Banner: BARBIE -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#EC4899" stroke="#1A1A1A" stroke-width="8"/>
    <rect x="6" y="6" width="488" height="48" rx="24" fill="#DB2777"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
      💖 PERSONAGEM BARBIE
    </text>
  </g>
</svg>
