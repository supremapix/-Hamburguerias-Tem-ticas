<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgSonic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="60%" stop-color="#0B3C68"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <linearGradient id="sonicBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00A2FF"/>
      <stop offset="50%" stop-color="#0066D6"/>
      <stop offset="100%" stop-color="#00449E"/>
    </linearGradient>
    <linearGradient id="peachMuzzle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="sonicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgSonic)"/>
  
  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFD54F" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Electric Speed Lightning / Gold Rings Aura -->
  <circle cx="300" cy="270" r="230" fill="#00A2FF" opacity="0.2"/>
  <circle cx="300" cy="270" r="160" fill="#FFD54F" opacity="0.15"/>

  <!-- Golden Ring Floating in Background -->
  <ellipse cx="120" cy="130" rx="35" ry="16" fill="none" stroke="url(#goldRing)" stroke-width="9" transform="rotate(-25 120 130)"/>
  <ellipse cx="480" cy="140" rx="32" ry="14" fill="none" stroke="url(#goldRing)" stroke-width="8" transform="rotate(30 480 140)"/>

  <!-- Sonic Character Group -->
  <g filter="url(#sonicShadow)">
    
    <!-- Big Quills / Hair Spikes (Left & Right & Top) -->
    <!-- Left Top Quill -->
    <path d="M 230 180 C 130 150, 80 230, 60 280 C 100 280, 160 260, 210 240 Z" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>
    <!-- Left Middle Quill -->
    <path d="M 200 260 C 90 280, 50 360, 40 420 C 90 390, 150 360, 200 330 Z" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>
    <!-- Left Lower Quill -->
    <path d="M 210 350 C 110 390, 80 470, 70 510 C 120 480, 180 440, 220 400 Z" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>

    <!-- Right Top Quill -->
    <path d="M 370 180 C 470 150, 520 230, 540 280 C 500 280, 440 260, 390 240 Z" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>
    <!-- Right Middle Quill -->
    <path d="M 400 260 C 510 280, 550 360, 560 420 C 510 390, 450 360, 400 330 Z" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>
    <!-- Right Lower Quill -->
    <path d="M 390 350 C 490 390, 520 470, 530 510 C 480 480, 420 440, 380 400 Z" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>

    <!-- Sonic Ears -->
    <!-- Left Ear -->
    <path d="M 210 160 L 260 110 L 260 180 Z" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>
    <path d="M 225 155 L 255 125 L 255 170 Z" fill="url(#peachMuzzle)"/>
    
    <!-- Right Ear -->
    <path d="M 390 160 L 340 110 L 340 180 Z" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>
    <path d="M 375 155 L 345 125 L 345 170 Z" fill="url(#peachMuzzle)"/>

    <!-- Blue Head Base -->
    <circle cx="300" cy="270" r="125" fill="url(#sonicBlue)" stroke="#0A192F" stroke-width="4"/>

    <!-- Sonic Eye Sockets (Iconic interconnected white shape) -->
    <path d="M 210 265 C 210 200, 270 180, 300 220 C 330 180, 390 200, 390 265 C 390 310, 340 330, 300 315 C 260 330, 210 310, 210 265 Z" 
          fill="#FFFFFF" stroke="#0A192F" stroke-width="4"/>

    <!-- Green Irises & Black Pupils (Focused forward / cheeky) -->
    <ellipse cx="270" cy="255" rx="14" ry="24" fill="#00E676" stroke="#0A192F" stroke-width="2"/>
    <ellipse cx="273" cy="255" rx="8" ry="16" fill="#0A192F"/>
    <circle cx="269" cy="247" r="4.5" fill="#FFFFFF"/>

    <ellipse cx="330" cy="255" rx="14" ry="24" fill="#00E676" stroke="#0A192F" stroke-width="2"/>
    <ellipse cx="327" cy="255" rx="8" ry="16" fill="#0A192F"/>
    <circle cx="331" cy="247" r="4.5" fill="#FFFFFF"/>

    <!-- Peach Muzzle Area -->
    <path d="M 215 315 C 215 285, 275 280, 300 295 C 325 280, 385 285, 385 315 C 385 375, 335 395, 300 395 C 265 395, 215 375, 215 315 Z" 
          fill="url(#peachMuzzle)" stroke="#0A192F" stroke-width="4"/>

    <!-- Black Shiny Nose -->
    <ellipse cx="300" cy="305" rx="14" ry="10" fill="#1A1A1A"/>
    <ellipse cx="297" cy="302" rx="4" ry="2.5" fill="#FFFFFF"/>

    <!-- Cheeky Smirk / Smile -->
    <path d="M 260 345 Q 310 380 350 335" fill="none" stroke="#0A192F" stroke-width="5" stroke-linecap="round"/>
    <path d="M 345 330 L 355 342" stroke="#0A192F" stroke-width="4" stroke-linecap="round"/>

    <!-- Body / Shoulders -->
    <path d="M 200 480 Q 300 440 400 480 L 430 580 L 170 580 Z" fill="url(#sonicBlue)"/>
    <circle cx="300" cy="510" r="50" fill="url(#peachMuzzle)"/>

    <!-- White Glove / Thumbs Up -->
    <g transform="translate(370, 420)">
      <ellipse cx="40" cy="40" rx="35" ry="30" fill="#FFFFFF" stroke="#0A192F" stroke-width="4"/>
      <!-- Thumb pointing up -->
      <path d="M 35 15 C 30 -10, 55 -15, 60 15 Z" fill="#FFFFFF" stroke="#0A192F" stroke-width="4"/>
      <!-- Glove cuff -->
      <rect x="0" y="55" width="80" height="20" rx="10" fill="#FFFFFF" stroke="#0A192F" stroke-width="3"/>
    </g>

  </g>

  <!-- Cinema Star Badges / Subtitle Banner -->
  <g transform="translate(0, 520)">
    <rect x="70" y="0" width="460" height="52" rx="26" fill="#1A1A1A" stroke="#00A2FF" stroke-width="3.5"/>
    <text x="300" y="34" font-family="'Baloo 2', 'Impact', sans-serif" font-size="22" font-weight="900" fill="#00A2FF" text-anchor="middle" letter-spacing="2">
      ★ PERSONAGEM SONIC THE HEDGEHOG ★
    </text>
  </g>
</svg>
