<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgPizza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#381010"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D78A2A"/>
      <stop offset="100%" stop-color="#8D4C13"/>
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="pepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="shadowPizza" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgPizza)"/>
  
  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.3">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Warm Oven Glow -->
  <circle cx="300" cy="270" r="230" fill="#FF5722" opacity="0.16"/>
  <circle cx="300" cy="270" r="160" fill="#FFB800" opacity="0.14"/>

  <!-- Pizza Group with Shadow -->
  <g filter="url(#shadowPizza)">
    
    <!-- Wooden Pizza Peel / Board -->
    <ellipse cx="300" cy="290" rx="200" ry="145" fill="#8D5B28" stroke="#1A1A1A" stroke-width="8"/>
    <!-- Board Handle -->
    <path d="M280 435 L280 500 L320 500 L320 435 Z" fill="#8D5B28" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Round Pizza Base (Crust) -->
    <ellipse cx="300" cy="285" rx="180" ry="125" fill="url(#crustGrad)" stroke="#1A1A1A" stroke-width="8"/>

    <!-- Tomato Sauce & Melted Golden Cheese Layer -->
    <ellipse cx="300" cy="285" rx="160" ry="108" fill="url(#cheeseGrad)" stroke="#E65100" stroke-width="3"/>

    <!-- Pepperoni Slices scattered -->
    <g>
      <ellipse cx="230" cy="240" rx="26" ry="18" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="295" cy="225" rx="28" ry="20" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="370" cy="250" rx="27" ry="19" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="210" cy="300" rx="27" ry="19" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="385" cy="310" rx="26" ry="18" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="270" cy="325" rx="28" ry="20" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="340" cy="320" rx="28" ry="20" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Pepperoni texture dots -->
      <circle cx="230" cy="240" r="3" fill="#FFCDD2"/>
      <circle cx="295" cy="225" r="3" fill="#FFCDD2"/>
      <circle cx="370" cy="250" r="3" fill="#FFCDD2"/>
      <circle cx="270" cy="325" r="3" fill="#FFCDD2"/>
      <circle cx="340" cy="320" r="3" fill="#FFCDD2"/>
    </g>

    <!-- Black Olives -->
    <ellipse cx="260" cy="265" rx="10" ry="8" fill="#1A1A1A"/>
    <ellipse cx="260" cy="265" rx="4" ry="3" fill="#D7CCC8"/>
    <ellipse cx="330" cy="260" rx="10" ry="8" fill="#1A1A1A"/>
    <ellipse cx="330" cy="260" rx="4" ry="3" fill="#D7CCC8"/>
    <ellipse cx="310" cy="335" rx="10" ry="8" fill="#1A1A1A"/>
    <ellipse cx="310" cy="335" rx="4" ry="3" fill="#D7CCC8"/>

    <!-- Fresh Basil Leaves (Green) -->
    <path d="M230 280 Q245 270, 255 285 Q240 295, 230 280 Z" fill="#4CAF50" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M350 280 Q365 270, 375 285 Q360 295, 350 280 Z" fill="#4CAF50" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M295 285 Q305 270, 320 280 Q305 295, 295 285 Z" fill="#4CAF50" stroke="#1A1A1A" stroke-width="2"/>

    <!-- Lifted Floating Cinema Pizza Slice with Cheesy Strings -->
    <g transform="translate(0, -65)">
      <!-- Molten Cheese Strings pulling down -->
      <path d="M285 240 Q290 310, 292 345 M315 240 Q310 310, 308 345 M300 240 Q300 320, 300 345" stroke="#FFE082" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M275 235 Q285 300, 280 340 M325 235 Q315 300, 320 340" stroke="#FFCA28" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- Lifted Slice Triangle -->
      <path d="M300 130 L380 235 Q300 260, 220 235 Z" fill="url(#cheeseGrad)" stroke="#1A1A1A" stroke-width="7"/>
      <!-- Slice Crust -->
      <path d="M210 235 Q300 265, 390 235 C385 220, 215 220, 210 235 Z" fill="url(#crustGrad)" stroke="#1A1A1A" stroke-width="6"/>
      <!-- Slice Pepperonis -->
      <ellipse cx="280" cy="180" rx="20" ry="14" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="325" cy="205" rx="20" ry="14" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <ellipse cx="265" cy="215" rx="18" ry="13" fill="url(#pepGrad)" stroke="#1A1A1A" stroke-width="3"/>
      <!-- Basil on Slice -->
      <path d="M300 195 Q310 185, 320 195 Q310 205, 300 195 Z" fill="#4CAF50" stroke="#1A1A1A" stroke-width="2"/>
    </g>

  </g>

  <!-- Cinema Title Banner: NOITE DA PIZZA • PIZZA FILM'S -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#E53935" stroke="#1A1A1A" stroke-width="8"/>
    <rect x="6" y="6" width="488" height="48" rx="24" fill="#C62828"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="2">
      🍕 NOITE DA PIZZA • PIZZA FILM'S
    </text>
  </g>
</svg>
