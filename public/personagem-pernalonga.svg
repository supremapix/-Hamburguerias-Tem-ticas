<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgBugs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="furGrey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="carrotOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="charShadowBugs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cinema Backdrop with Film Frame -->
  <rect width="600" height="600" rx="36" fill="url(#bgBugs)"/>

  <!-- Film Sprocket Holes along left and right -->
  <g fill="#FFB800" opacity="0.35">
    <rect x="15" y="30" width="25" height="20" rx="4"/>
    <rect x="15" y="80" width="25" height="20" rx="4"/>
    <rect x="15" y="130" width="25" height="20" rx="4"/>
    <rect x="15" y="180" width="25" height="20" rx="4"/>
    <rect x="15" y="230" width="25" height="20" rx="4"/>
    <rect x="15" y="280" width="25" height="20" rx="4"/>
    <rect x="15" y="330" width="25" height="20" rx="4"/>
    <rect x="15" y="380" width="25" height="20" rx="4"/>
    <rect x="15" y="430" width="25" height="20" rx="4"/>
    <rect x="15" y="480" width="25" height="20" rx="4"/>
    <rect x="15" y="530" width="25" height="20" rx="4"/>

    <rect x="560" y="30" width="25" height="20" rx="4"/>
    <rect x="560" y="80" width="25" height="20" rx="4"/>
    <rect x="560" y="130" width="25" height="20" rx="4"/>
    <rect x="560" y="180" width="25" height="20" rx="4"/>
    <rect x="560" y="230" width="25" height="20" rx="4"/>
    <rect x="560" y="280" width="25" height="20" rx="4"/>
    <rect x="560" y="330" width="25" height="20" rx="4"/>
    <rect x="560" y="380" width="25" height="20" rx="4"/>
    <rect x="560" y="430" width="25" height="20" rx="4"/>
    <rect x="560" y="480" width="25" height="20" rx="4"/>
    <rect x="560" y="530" width="25" height="20" rx="4"/>
  </g>

  <!-- Glowing Looney Stage Spotlight / Concentric Target Rings -->
  <circle cx="300" cy="270" r="230" fill="#EA580C" opacity="0.12"/>
  <circle cx="300" cy="270" r="160" fill="#FACC15" opacity="0.15"/>
  <circle cx="300" cy="270" r="90" fill="#FACC15" opacity="0.1"/>

  <!-- Character Group with Shadow -->
  <g filter="url(#charShadowBugs)">
    
    <!-- Long Rabbit Ears (Back Layer) -->
    <!-- Left Ear -->
    <g transform="rotate(-12, 230, 200)">
      <path d="M210 210 C170 120, 180 30, 225 35 C250 40, 260 120, 250 210 Z" fill="url(#furGrey)" stroke="#1A1A1A" stroke-width="7"/>
      <path d="M218 190 C195 125, 200 65, 225 68 C242 72, 248 125, 242 190 Z" fill="url(#earPink)"/>
    </g>
    <!-- Right Ear -->
    <g transform="rotate(14, 370, 200)">
      <path d="M350 210 C340 120, 350 35, 375 35 C420 30, 430 120, 390 210 Z" fill="url(#furGrey)" stroke="#1A1A1A" stroke-width="7"/>
      <path d="M358 190 C352 125, 358 72, 375 68 C400 65, 405 125, 382 190 Z" fill="url(#earPink)"/>
    </g>

    <!-- Torso / Shoulders -->
    <path d="M190 495 C195 425, 240 405, 300 405 C360 405, 405 425, 410 495 Z" fill="url(#furGrey)" stroke="#1A1A1A" stroke-width="7"/>
    <!-- White Chest Fur -->
    <path d="M245 420 C245 470, 270 495, 300 495 C330 495, 355 470, 355 420 C330 435, 270 435, 245 420 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Head Base (Grey) -->
    <ellipse cx="300" cy="275" rx="85" ry="95" fill="url(#furGrey)" stroke="#1A1A1A" stroke-width="7"/>

    <!-- Fluffy White Cheeks & Muzzle -->
    <path d="M210 305 C185 300, 185 355, 230 365 C265 372, 290 355, 300 340 C310 355, 335 372, 370 365 C415 355, 415 300, 390 305 C365 295, 340 280, 300 280 C260 280, 235 295, 210 305 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6"/>

    <!-- Big Expressive Cartoon Eyes -->
    <ellipse cx="268" cy="235" rx="22" ry="40" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>
    <ellipse cx="332" cy="235" rx="22" ry="40" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/>

    <!-- Pupils (Looking playfully forward/right) -->
    <ellipse cx="274" cy="242" rx="11" ry="20" fill="#1A1A1A"/>
    <circle cx="277" cy="236" r="4" fill="#FFFFFF"/>

    <ellipse cx="338" cy="242" rx="11" ry="20" fill="#1A1A1A"/>
    <circle cx="341" cy="236" r="4" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M246 195 Q268 180, 290 195" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M310 195 Q332 180, 354 195" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Cute Pink Nose -->
    <ellipse cx="300" cy="295" rx="15" ry="10" fill="#FB7185" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Playful Smiling Rabbit Mouth -->
    <path d="M265 330 Q300 365, 335 330" stroke="#1A1A1A" stroke-width="6" fill="#991B1B"/>
    <!-- Pink Tongue -->
    <path d="M282 342 Q300 330, 318 342 Q300 360, 282 342 Z" fill="#F472B6"/>

    <!-- Iconic Two White Buck Front Teeth -->
    <g transform="translate(286, 316)">
      <rect x="0" y="0" width="13" height="18" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
      <rect x="15" y="0" width="13" height="18" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
    </g>

    <!-- Whiskers -->
    <line x1="205" y1="320" x2="140" y2="310" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
    <line x1="205" y1="335" x2="135" y2="335" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
    <line x1="205" y1="350" x2="145" y2="360" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>

    <line x1="395" y1="320" x2="460" y2="310" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
    <line x1="395" y1="335" x2="465" y2="335" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
    <line x1="395" y1="350" x2="455" y2="360" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>

    <!-- Crunchy Crunchy Carrot (Right Hand) -->
    <g transform="translate(415, 370) rotate(-35)">
      <!-- Orange Carrot Body -->
      <polygon points="0,-12 90,0 0,12" fill="url(#carrotOrange)" stroke="#1A1A1A" stroke-width="4"/>
      <!-- Carrot Lines -->
      <line x1="25" y1="-8" x2="25" y2="0" stroke="#C2410C" stroke-width="2.5"/>
      <line x1="50" y1="0" x2="50" y2="6" stroke="#C2410C" stroke-width="2.5"/>
      <line x1="70" y1="-3" x2="70" y2="3" stroke="#C2410C" stroke-width="2.5"/>
      <!-- Green Leaves Top -->
      <path d="M0 -12 C-15 -35, -35 -20, -10 -5" fill="#22C55E" stroke="#1A1A1A" stroke-width="3"/>
      <path d="M0 -6 C-25 -15, -30 15, -10 6" fill="#16A34A" stroke="#1A1A1A" stroke-width="3"/>
      <!-- White Glove Thumb -->
      <ellipse cx="20" cy="0" rx="14" ry="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
    </g>

  </g>

  <!-- Cinema Title Banner: PERNALONGA -->
  <g transform="translate(50, 515)">
    <rect x="0" y="0" width="500" height="60" rx="30" fill="#EA580C" stroke="#1A1A1A" stroke-width="8"/>
    <rect x="6" y="6" width="488" height="48" rx="24" fill="#0F172A"/>
    <text x="250" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="25" font-weight="900" text-anchor="middle" fill="#FACC15" letter-spacing="2">
      🥕 PERSONAGEM PERNALONGA
    </text>
  </g>
</svg>
